# dota2cl configuration file
#
# Settings are applied in this order, each one overriding the previous:
#   1. Application defaults
#   2. This file
#   3. Environment variables named DOTA2CL_<SECTION>_<KEY>,
#      e.g. DOTA2CL_API_THROTTLE=true or DOTA2CL_REPORT_NUM_TEAMS=10
#   4. Command line options
#
# Default location: /etc/dota2cl.conf on Linux-like systems, created from
# the copy bundled with the package if missing and /etc is writable.
# Otherwise the bundled copy is used. Use --config or DOTA2CL_CONFIG
# to point to another file.

[api]
# OpenDota API base URL
base_url = https://api.opendota.com/api
# API key. Leave empty for anonymous access, which has lower rate limits.
# Can also be set with OPENDOTA_API_KEY or DOTA2CL_API_KEY.
# Files in /etc are usually readable by all users,
# so prefer the environment variable on shared machines.
key =
# Timeout for a single HTTP request, in seconds
timeout_sec = 180
# Wait between requests to avoid hitting API rate limits
throttle = false
throttle_timeout_sec = 1
# Retries for 429 Too Many Requests responses.
# The wait between retries starts at retry_backoff_sec
# and doubles on every retry.
max_retries = 3
retry_backoff_sec = 2
# How long API responses are cached, in seconds
cache_timeout_sec = 60

[report]
# Number of teams in the report
num_teams = 5
# Preload all teams, so players with team_id 0
# can be matched to a team by name
preload_teams = false

[logging]
# Log file path. Leave empty to use the user cache directory:
#   Linux:   ~/.cache/dota2cl/dota2cl.log
#   macOS:   ~/Library/Caches/dota2cl/dota2cl.log
#   Windows: %LOCALAPPDATA%\dota2cl\dota2cl.log
# falling back to the current directory if it can't be created.
file =
# Log file level: CRITICAL, ERROR, WARNING, INFO or DEBUG
level = WARNING
# Console output level
cli_level = WARNING
